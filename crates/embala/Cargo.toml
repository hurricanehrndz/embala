[package]
name = "embala"
description = "One config, every installer — .msi, .app, .deb, .pkg, and Chocolatey .nupkg from any host OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
embala-msi = { version = "0.0.1", path = "../embala-msi" }
embala-nupkg = { version = "0.0.1", path = "../embala-nupkg" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
