[package]
name = "embala"
description = "One config, every installer — .msi, .app, .deb, .pkg, and Chocolatey .nupkg from any host OS"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.103"
apple-bundles = "0.21"
clap = { version = "4.6.1", features = ["derive"] }
embala-msi = { version = "0.2.1", path = "../embala-msi" }
embala-nupkg = { version = "0.2.1", path = "../embala-nupkg" }
embala-pkg = { version = "0.2.1", path = "../embala-pkg" }
embala-setup = { version = "0.2.1", path = "../embala-setup" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
plist = "1"
serde = { version = "1.0.228", features = ["derive"] }
simple-file-manifest = "0.11"
tauri-icns = "0.1"
toml = "1.1.2"

[dev-dependencies]
# The sign integration test parses the produced setup.exe's overlay trailer to
# assert the signed uninstall stub was actually embedded.
embala-setup-overlay = { version = "0.2.1", path = "../embala-setup-overlay" }
