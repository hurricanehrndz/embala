[package]
name = "embala-setup"
description = "Windows setup.exe builder — appends a payload overlay onto a prebuilt runtime stub, no compile"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
# Shared PE-overlay trailer format (the runtime's counterpart).
embala-setup-overlay = { version = "0.3.0", path = "../embala-setup-overlay" }
# PE resource editor for build-time stub branding (icon, VERSIONINFO, banner).
# Default features carry `images` (PNG/ICO decode) + `std`.
editpe = "0.2.3"
thiserror = "2.0.18"
# Deterministic payload zip, mirroring embala-nupkg's option style.
zip = "8"

[dev-dependencies]
tempfile = "3"
