[package]
name = "embala-setup-overlay"
description = "Shared PE-overlay trailer format for embala's setup.exe writer and runtime stub"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The manifest (product identity + resolved mode) is overlay-format, same as the
# trailer: the writer serializes it and the runtime deserializes it, so the type
# lives here. Struct field order gives deterministic JSON (spec R8).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
