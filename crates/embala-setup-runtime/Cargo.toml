[package]
name = "embala-setup-runtime"
description = "Win32 self-extractor stub cross-compiled once and embedded into embala-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "setup-stub"
path = "src/main.rs"

[dependencies]
# Vendored PUC Lua 5.4 host. A normal (not Windows-gated) dep so the C also
# compiles on this Linux host — proving the vendored build before zig ever runs.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# Shared PE-overlay trailer format (the writer's counterpart).
embala-setup-overlay = { version = "0.0.1", path = "../embala-setup-overlay" }

[target.'cfg(windows)'.dependencies]
# Win32 GUI/console surface; Windows-only so `cargo build --workspace` still
# links on Linux. `kernel` gives AttachConsole, `user` gives MessageBox.
winsafe = { version = "0.0.28", features = ["kernel", "user"] }
# Self-extraction reads the payload zip; Windows-only (the extractor runs only
# there) with just the pure-Rust zlib-rs deflate backend so zig cross-linking
# stays trivial — no bzip2/zstd/lzma C.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
