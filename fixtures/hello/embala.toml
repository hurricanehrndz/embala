# Test fixture: one config exercising all five v1 formats.
# Payload `src` paths are relative to this file; `just fixtures` builds
# dist/hello.exe (mingw cross) and dist/hello-mac (zig cc, arm64 Mach-O —
# rcodesign refuses to sign a script-backed .app). hello.sh stays the [pkg]
# payload (XAR signing is content-agnostic); scripts/postinstall is its
# pkgbuild-style install hook.

[package]
name = "hello"
display-name = "Embala Hello"
version = "0.1.0"
identifier = "ca.hrndz.embala.hello"
publisher = "Carlos Hernandez"
description = "Embala end-to-end test fixture"
homepage = "https://github.com/hurricanehrndz/embala"
license = "MIT"
copyright = "© 2026 Carlos Hernandez"
tags = ["cli", "embala", "demo"]
icon = "icon.png"

[msi]
arch = "x86_64"
main-executable = "hello.exe"
files = [{ src = "dist/hello.exe", dest = "hello.exe" }]
# Registers hello.exe as a Windows service (ServiceInstall/ServiceControl).
# "disabled" because hello.exe is not a real service: an auto/demand service
# is started on install, which would fail and roll the install back.
service = { name = "embala-hello", display-name = "Embala Hello", description = "Embala test service", start = "disabled" }

[app]
executable = "dist/hello-mac"

[pkg]
install-location = "/usr/local"
enable-user-home = true
scripts = "scripts"
files = [{ src = "hello.sh", dest = "bin/embala-hello" }]

[nupkg]
style = "embedded"
project-source-url = "https://github.com/hurricanehrndz/embala"
package-source-url = "https://github.com/hurricanehrndz/embala"
release-notes = "https://github.com/hurricanehrndz/embala/releases"
icon-url = "https://github.com/hurricanehrndz/embala/raw/main/fixtures/hello/icon.png"
license-url = "https://github.com/hurricanehrndz/embala/blob/main/LICENSE"
files = [{ src = "dist/hello.exe", dest = "hello.exe" }]

[setup]
# Declarative sugar: embala lowers this to a generated install.lua over the
# embala.* API (spec R19). The raw-script escape hatch lives in embala-script.toml.
arch = "x86_64"
main-executable = "hello.exe"
license = "license.txt"
icon = "icon.png"
banner = "banner.bmp"
files = [{ src = "dist/hello.exe", dest = "hello.exe" }]
components = [
  { id = "docs", label = "Documentation", description = "Offline readme", default = true, files = [{ src = "readme.txt", dest = "readme.txt" }] },
]
uninstall-options = [
  { id = "purge-data", label = "Delete all Hello data", default = false },
]

# User-supplied signing commands (spec R5/R6). Kept commented so the fixture
# stays unsigned and byte-reproducible for the deterministic build/msi-diff
# tests. `$f` = the artifact's absolute path; embala only shells out.
# [sign.windows]
# osslsigncode refuses in==out, so sign to a sidecar and move it back:
# command = "osslsigncode sign -pkcs12 certs/test-win.pfx -readpass certs/pw.txt -in $f -out $f.signed && mv $f.signed $f"
# signed-stub = "signed-stub.exe"   # optional, pre-signed uninstall stub
#
# [sign.macos]
# command = "rcodesign sign --p12-file certs/test-mac.p12 $f"
