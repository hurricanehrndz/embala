name: release
# Tag-driven: `git tag v0.1.0 && git push --tags`. The tag must match the
# workspace version — the `meta` job fails the run otherwise. A tag run
# publishes the GitHub release, then the workspace crates to crates.io.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  # Pinned to the versions devenv.nix puts in the dev shell, so a local
  # cross-build and a release build use the same toolchain.
  ZIG_VERSION: 0.16.0
  CARGO_ZIGBUILD_VERSION: 0.23.0
  JUST_VERSION: 1.57.0
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Resolve version and check it against the tag
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "embala") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "embala $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version (expected v$version)"
            exit 1
          fi
  # crates/embala-setup `include_bytes!`-embeds a setup.exe stub for each
  # Windows arch, so *every* build job needs both before the CLI will compile
  # — and no single job can produce the other arch's. Build them once here and
  # hand them to the matrix.
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the zig cross toolchain and just
        run: |
          # A plain venv rather than pipx: cargo-zigbuild finds zig by running
          # `python3 -m ziglang`, so the interpreter carrying `ziglang` has to
          # be the one on PATH — pipx would hide it in an isolated venv.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "ziglang==$ZIG_VERSION" \
            "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION" \
            "rust-just==$JUST_VERSION"
          # The wheel exposes zig only as `python -m ziglang`, but
          # embala-setup-runtime's build.rs shells out to a real `zig` for
          # `zig rc`. Shim it so both entry points hit the same pinned zig.
          printf '#!/bin/sh\nexec "%s/bin/python3" -m ziglang "$@"\n' \
            "$RUNNER_TEMP/venv" > "$RUNNER_TEMP/venv/bin/zig"
          chmod +x "$RUNNER_TEMP/venv/bin/zig"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: rustup target add x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm
      - run: just stubs
      - uses: actions/upload-artifact@v7
        with:
          name: setup-stubs
          path: crates/embala-setup/stubs/
          if-no-files-found: error
  build:
    needs: [meta, stubs]
    runs-on: ${{ matrix.os }}
    # Signing credentials live in the `release` environment, which only `v*`
    # tags may deploy to. Only tag runs of the targets that sign enter it, so
    # a workflow_dispatch build still runs, unsigned.
    environment: ${{ (github.ref_type == 'tag' && matrix.sign) && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows cross-compile cleanly from one Linux host via
          # zig; macOS does not (cargo-zigbuild needs a macOS SDK for it), so
          # darwin builds natively on an arm64 runner.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cargo: zigbuild
            archive: tar
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cargo: zigbuild
            archive: tar
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            cargo: zigbuild
            archive: zip
            suffix: .exe
            sign: windows
          - target: aarch64-pc-windows-gnullvm
            os: ubuntu-latest
            cargo: zigbuild
            archive: zip
            suffix: .exe
            sign: windows
          - target: aarch64-apple-darwin
            os: macos-latest
            cargo: build
            archive: tar
            sign: macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: setup-stubs
          path: crates/embala-setup/stubs/
      - run: rustup target add ${{ matrix.target }}
      - name: Install the zig cross toolchain
        if: matrix.cargo == 'zigbuild'
        run: |
          # See the stubs job for why this is a venv and not pipx, and why
          # `zig` needs a shim on top of the wheel.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "ziglang==$ZIG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
          printf '#!/bin/sh\nexec "%s/bin/python3" -m ziglang "$@"\n' \
            "$RUNNER_TEMP/venv" > "$RUNNER_TEMP/venv/bin/zig"
          chmod +x "$RUNNER_TEMP/venv/bin/zig"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo ${{ matrix.cargo }} -p embala --release --target ${{ matrix.target }}
      # The musl targets are the ones that can be fully static, and a silent
      # regression to dynamic linking is exactly the kind of thing nobody
      # notices until a binary fails to start on someone else's distro.
      - name: Check linkage
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/embala${{ matrix.suffix }}"
          file "$bin"
          case "${{ matrix.target }}" in
            *-linux-musl)
              file "$bin" | grep -q "statically linked" \
                || { echo "::error::${{ matrix.target }} binary is not statically linked"; exit 1; }
              ;;
            *-apple-darwin)
              # Cannot be static — macOS only supports linking libSystem
              # dynamically. Print it so the dependency set stays visible.
              otool -L "$bin"
              ;;
          esac
      # Authenticode through Azure Trusted Signing, with jsign from Linux, the
      # same setup as sofcat (its reference/code-signing.md). The runner image
      # supplies Java and the Azure CLI. A tag run is never released unsigned:
      # a missing variable or secret fails the step.
      - name: Sign (Windows)
        if: github.ref_type == 'tag' && matrix.sign == 'windows'
        env:
          JSIGN_VERSION: "7.6"
          JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
            TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT TRUSTED_SIGNING_PROFILE; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" \
            "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" --allow-no-subscriptions --output none
          token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken --output tsv)
          echo "::add-mask::$token"
          java -jar "$RUNNER_TEMP/jsign.jar" --storetype TRUSTEDSIGNING \
            --keystore "$TRUSTED_SIGNING_ENDPOINT" --storepass "$token" \
            --alias "$TRUSTED_SIGNING_ACCOUNT/$TRUSTED_SIGNING_PROFILE" \
            --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 \
            --name embala --url https://github.com/hurricanehrndz/embala \
            "target/${{ matrix.target }}/release/embala.exe"
      # Developer ID signature (hardened runtime, timestamped) from a throwaway
      # keychain, then notarization. A bare Mach-O cannot hold a stapled
      # ticket, so Gatekeeper looks it up online on first run.
      - name: Sign and notarize (macOS)
        if: github.ref_type == 'tag' && matrix.sign == 'macos'
        env:
          APPLE_CODESIGN_P12_BASE64: ${{ secrets.APPLE_CODESIGN_P12_BASE64 }}
          APPLE_CODESIGN_P12_PASSWORD: ${{ secrets.APPLE_CODESIGN_P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          for v in APPLE_CODESIGN_P12_BASE64 APPLE_CODESIGN_P12_PASSWORD NOTARY_API_KEY_P8 \
            NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID CODESIGN_IDENTITY; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf %s "$APPLE_CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -P "$APPLE_CODESIGN_P12_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          bin="target/${{ matrix.target }}/release/embala"
          codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          printf '%s\n' "$NOTARY_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k "$bin" "$RUNNER_TEMP/embala-notarize.zip"
          # notarytool exits 0 on an Invalid verdict too, so check the status.
          result=$(xcrun notarytool submit "$RUNNER_TEMP/embala-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" --wait --output-format json)
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "$result"
          [ "$(jq -r .status <<<"$result")" = Accepted ] \
            || { echo "::error::notarization was not accepted"; exit 1; }
      - name: Package
        shell: bash
        run: |
          name="embala-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          cp "target/${{ matrix.target }}/release/embala${{ matrix.suffix }}" "staging/$name/"
          cp README.md LICENSE "staging/$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd staging && zip -qr "../$name.zip" "$name")
          else
            tar -czf "$name.tar.gz" -C staging "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: embala-${{ matrix.target }}
          path: |
            embala-*.tar.gz
            embala-*.zip
          if-no-files-found: error
  release:
    needs: [meta, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut the release
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: embala-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum embala-* | tee SHA256SUMS
      # Build provenance for every archive, including the Linux ones, which
      # have no signature format of their own. Verify with
      # `gh attestation verify <file> --repo hurricanehrndz/embala`.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/embala-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "embala ${{ needs.meta.outputs.version }}" \
            --generate-notes \
            dist/*
  # Trusted publishing: crates-io-auth-action trades the job's OIDC identity
  # for a ~30-minute crates.io token, so the repo holds no registry secret.
  # Each crate's crates.io settings trust release.yml in the `crates-io`
  # environment, which only `v*` tags may deploy to. Runs after `release` so a
  # failed build never reaches crates.io, where a publish cannot be undone.
  crates:
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # embala-setup embeds the stubs; ship the same ones the release
      # binaries were built with.
      - uses: actions/download-artifact@v8
        with:
          name: setup-stubs
          path: crates/embala-setup/stubs/
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # --allow-dirty: the stubs are gitignored build products, which cargo
      # counts as uncommitted changes once embala-setup's `include` packages
      # them. The checkout is otherwise clean.
      - run: cargo publish --workspace --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
